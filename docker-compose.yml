# =============================================================================
# Docker Compose — NATS Server (ships-computer)
# =============================================================================
# Builds custom NATS image with envsubst support for password injection,
# mounts config read-only, and persists JetStream data to a named volume.
#
# Usage:
#   cp .env.example .env   # Set real passwords
#   docker compose up -d
#
# See config/nats-server.conf for server settings and
# config/accounts/accounts.conf.template for account definitions.
#
# ⚠️  WARNING — DATA LOSS:
#   `docker compose down -v` removes the nats-data volume and DESTROYS ALL
#   JetStream data (streams, messages, consumers, KV buckets). Use plain
#   `docker compose down` to stop containers while preserving persistent data.
#   Only use `-v` / `--volumes` when you intentionally want a clean slate.
# =============================================================================

services:
  nats:
    build: .
    container_name: ships-computer-nats
    restart: unless-stopped
    # DF-022 sops cutover (Wave 3, 2026-07-30 — PAGE-nats §10.4): the 8 account
    # passwords live sops-encrypted at ~/.config/fleet-secrets/nats/broker.enc.env
    # and are injected by `sops exec-env … 'docker compose up -d --force-recreate nats'`.
    # `environment:` interpolation (NOT env_file:) kills the false-green hazard class
    # permanently: envsubst can only ever receive real values from the child env —
    # an in-place-encrypted env_file would have fed ENC[…] ciphertext THROUGH the
    # render-safety gate into accounts.conf (fleet-wide auth outage). `:?` makes a
    # bare `up -d` fail loudly instead of rendering empty passwords.
    environment:
      ADMIN_NATS_PASSWORD: ${ADMIN_NATS_PASSWORD:?run via sops exec-env — see header}
      RICH_NATS_PASSWORD: ${RICH_NATS_PASSWORD:?run via sops exec-env — see header}
      JAMES_NATS_PASSWORD: ${JAMES_NATS_PASSWORD:?run via sops exec-env — see header}
      MARK_NATS_PASSWORD: ${MARK_NATS_PASSWORD:?run via sops exec-env — see header}
      FORGE_NATS_PASSWORD: ${FORGE_NATS_PASSWORD:?run via sops exec-env — see header}
      FLEET_MEMORY_NATS_PASSWORD: ${FLEET_MEMORY_NATS_PASSWORD:?run via sops exec-env — see header}
      GUARDKIT_NATS_PASSWORD: ${GUARDKIT_NATS_PASSWORD:?run via sops exec-env — see header}
      JARVIS_NATS_PASSWORD: ${JARVIS_NATS_PASSWORD:?run via sops exec-env — see header}

    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring

    volumes:
      # JetStream persistent storage
      - nats-data:/data/jetstream

      # Server config (read-only)
      - ./config/nats-server.conf:/etc/nats/nats-server.conf:ro

      # Account templates for envsubst processing (read-only)
      - ./config/accounts:/etc/nats/config/accounts:ro

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

    networks:
      - ships-computer

# Named volumes persist across `docker compose down` but are DESTROYED by
# `docker compose down -v`. See warning at top of file.
volumes:
  nats-data:

networks:
  ships-computer:
