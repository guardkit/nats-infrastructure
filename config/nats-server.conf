# =============================================================================
# NATS Server Configuration — ships-computer
# =============================================================================
# Main configuration for the NATS server deployed on Dell DGX Spark GB10 (128GB).
# JetStream is enabled with file-based storage for persistent messaging.
# Designed for Tailscale mesh VPN access — binds to all interfaces.

# Server identity
server_name: "ships-computer"

# ---------------------------------------------------------------------------
# Client connection settings
# ---------------------------------------------------------------------------
# Bind to all interfaces for Tailscale mesh VPN access.
# Port 4222 is the standard NATS client port.
host: "0.0.0.0"
port: 4222

# Maximum message payload size (1MB = 1048576 bytes)
max_payload: 1048576

# ---------------------------------------------------------------------------
# HTTP monitoring endpoint
# ---------------------------------------------------------------------------
# Provides health checks and metrics at http://0.0.0.0:8222
http: "0.0.0.0:8222"

# ---------------------------------------------------------------------------
# JetStream — persistent messaging with file-based storage
# ---------------------------------------------------------------------------
# Enables at-least-once delivery, stream replay, and durable consumers.
# Memory and file limits are conservative for 128GB GB10 — leaves headroom
# for GPU workloads and other services.
jetstream {
    store_dir: "/data/jetstream"
    max_mem: 1GB
    max_file: 10GB
}

# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
# Log to file with timestamps for structured log aggregation.
# Debug and trace are disabled by default to reduce noise in production.
log_file: "/var/log/nats/nats-server.log"
logtime: true
debug: false
trace: false

# ---------------------------------------------------------------------------
# Account configuration (included from separate files)
# ---------------------------------------------------------------------------
# Account definitions are maintained in separate files for modularity.
# Each account can define its own users, permissions, and JetStream limits.
include "accounts/*.conf"
